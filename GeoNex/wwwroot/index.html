<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>GeoNex Desktop</title>
    <base href="/" />

    <link href="GeoNex.styles.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />

    <meta name="ms-webview-background-color" content="transparent" />

    <style>
        /* RESET DE TRANSPARÊNCIA ABSOLUTA */
        html, body, #app {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: transparent !important;
            background-color: transparent !important;
        }

        /* Tela de carregamento nativa com fundo transparente */
        .loading-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: transparent !important;
            color: #cccccc;
            font-family: 'Segoe UI', sans-serif;
            letter-spacing: 2px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #007acc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="loading-screen">
            <div class="loading-spinner"></div>
            <h3>INICIALIZANDO GEONEX CORE</h3>
            <span style="font-size: 0.7rem; color: #858585; margin-top: 10px;">Carregando módulos espaciais...</span>
        </div>
    </div>

    <div id="blazor-error-ui" style="display: none; background: #c62828; color: white; position: fixed; bottom: 0; width: 100%; padding: 12px 18px; z-index: 9999; box-shadow: 0 -4px 16px rgba(0,0,0,0.5);">
        <div style="font-weight: bold; font-size: 13px;">
            Falha no sistema.
            <a href="" class="reload" style="color: #38bdf8; text-decoration: underline; margin-left: 15px; font-weight: normal;">Reiniciar Recurso</a>
            <a class="dismiss" style="float: right; cursor: pointer; margin-right: 15px;">✕</a>
        </div>
        <div id="blazor-error-detail" style="font-size: 11px; font-family: monospace; white-space: pre-wrap; margin-top: 6px; max-height: 120px; overflow-y: auto; background: rgba(0,0,0,0.3); padding: 6px; border-radius: 4px; display: none;"></div>
    </div>

    <script>
        window.addEventListener('error', function(event) {
            var detail = document.getElementById('blazor-error-detail');
            if (detail) {
                detail.style.display = 'block';
                detail.innerText = (event.message || event.type) + (event.filename ? ('\n' + event.filename + ':' + event.lineno) : '');
            }
        });
        var originalConsoleError = console.error;
        console.error = function() {
            originalConsoleError.apply(console, arguments);
            var detail = document.getElementById('blazor-error-detail');
            if (detail) {
                detail.style.display = 'block';
                var msg = Array.prototype.slice.call(arguments).map(function(item) {
                    return typeof item === 'object' ? JSON.stringify(item) : String(item);
                }).join(' ');
                detail.innerText = (detail.innerText ? detail.innerText + '\n' : '') + msg;
            }
        };
    </script>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <script>
        var scriptMapa = document.createElement('script');
        scriptMapa.src = 'js/mapa.js?t=' + new Date().getTime();
        document.body.appendChild(scriptMapa);
        var scriptComposer = document.createElement('script');
        scriptComposer.src = 'js/composer_v2.js?t=' + new Date().getTime();
        document.body.appendChild(scriptComposer);
    </script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
</body>
</html>
